<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Oficina 360">
  <title>Oficina 360</title>
  <defs>
    <linearGradient id="bg" x1="55" y1="36" x2="454" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343a43"/>
      <stop offset=".48" stop-color="#1c2025"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="steel" x1="70" y1="80" x2="442" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2f3f4"/>
      <stop offset=".25" stop-color="#9fa6ae"/>
      <stop offset=".52" stop-color="#e4e6e9"/>
      <stop offset=".78" stop-color="#6f767e"/>
      <stop offset="1" stop-color="#d7dade"/>
    </linearGradient>
    <linearGradient id="red" x1="82" y1="70" x2="430" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff3139"/>
      <stop offset=".52" stop-color="#df171f"/>
      <stop offset="1" stop-color="#8f0c12"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#e31b23" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#bg)" stroke="#aeb4bb" stroke-width="9"/>
  <rect x="27" y="27" width="458" height="458" rx="91" fill="none" stroke="#e31b23" stroke-width="4" opacity=".88"/>

  <!-- engrenagem -->
  <g filter="url(#shadow)">
    <path d="M238 54h36l8 29c13 3 25 8 37 14l26-15 26 26-15 26c6 12 11 24 14 37l29 8v36l-29 8c-3 13-8 25-14 37l15 26-26 26-26-15c-12 6-24 11-37 14l-8 29h-36l-8-29c-13-3-25-8-37-14l-26 15-26-26 15-26c-6-12-11-24-14-37l-29-8v-36l29-8c3-13 8-25 14-37l-15-26 26-26 26 15c12-6 24-11 37-14z" fill="#272c32" stroke="url(#steel)" stroke-width="9"/>
    <circle cx="256" cy="197" r="116" fill="#111418" stroke="#e31b23" stroke-width="8" filter="url(#redGlow)"/>
    <circle cx="256" cy="197" r="102" fill="#171b20" stroke="#7b828a" stroke-width="3"/>
  </g>

  <!-- veículos estilizados -->
  <g filter="url(#shadow)" stroke="#e6e8eb" stroke-width="4" stroke-linejoin="round">
    <!-- van -->
    <path d="M105 230v-54c0-18 10-31 27-35l51-7 23 26v70z" fill="#4b5159"/>
    <path d="M119 171h62l16 18h-78z" fill="#111418"/>
    <path d="M114 215h88" stroke="#e31b23" stroke-width="5"/>
    <circle cx="137" cy="229" r="15" fill="#111418"/><circle cx="181" cy="229" r="15" fill="#111418"/>

    <!-- ônibus central -->
    <path d="M182 226V120c0-27 16-42 42-46h65c27 4 42 19 42 46v106z" fill="url(#steel)"/>
    <path d="M201 104c15-12 96-12 111 0v55H201z" fill="#111418"/>
    <path d="M205 171h103v31H205z" fill="#333941" stroke="#757c84"/>
    <path d="M203 214h107" stroke="#e31b23" stroke-width="6"/>
    <circle cx="215" cy="226" r="17" fill="#111418"/><circle cx="299" cy="226" r="17" fill="#111418"/>

    <!-- caminhão -->
    <path d="M319 230v-67h41l20 21h25v46z" fill="#515860"/>
    <path d="M330 174h28l14 15h-42z" fill="#111418"/>
    <path d="M322 214h79" stroke="#e31b23" stroke-width="5"/>
    <circle cx="344" cy="229" r="15" fill="#111418"/><circle cx="383" cy="229" r="15" fill="#111418"/>
  </g>

  <!-- ferramentas cruzadas -->
  <g transform="translate(0 22)" filter="url(#shadow)">
    <path d="M118 381l33-33 177-177c-6-22 0-45 17-62 15-15 36-22 56-18l-38 38 8 28 28 8 38-38c4 20-3 41-18 56-17 17-40 23-62 17L183 377l-33 33c-9 9-23 9-32 0s-9-20 0-29z" fill="url(#steel)" stroke="#e31b23" stroke-width="6"/>
    <path d="M119 119c17-17 43-21 64-11l-25 25 11 32 32 11 25-25c10 21 6 47-11 64-10 10-23 16-36 18l201 146c12 9 14 26 5 38-9 12-26 14-38 5L154 251c-19-1-37-9-51-23-30-30-30-79 0-109 5-5 10-9 16-12z" fill="#8c939b" stroke="#e9eaec" stroke-width="5"/>
    <path d="M318 372l54 39" stroke="#e31b23" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- brilho inferior -->
  <path d="M112 454h288" stroke="#e31b23" stroke-width="8" stroke-linecap="round" opacity=".9" filter="url(#redGlow)"/>
</svg>