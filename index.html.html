<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Controla • Beta</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0f172a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.kpi{font-size:28px;font-weight:900}.label,.muted{font-size:12px;color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;white-space:nowrap}.nav button{background:#e2e8f0}.nav button.active,.btn.primary{background:var(--accent);color:#fff}.btn.soft{background:#e2e8f0}.hidden{display:none!important}.login{max-width:430px;margin:55px auto}.login input,.chat input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 10px;font:inherit}.section{display:none}.section.active{display:block}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.item strong{display:block}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#e2e8f0}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.danger{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chatbox{min-height:220px;max-height:52vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:88%;white-space:pre-wrap}.msg.user{margin-left:auto;background:#e2e8f0}.msg.ai{background:#fff7ed;border:1px solid #fed7aa}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;background:white;color:#0f172a;display:grid;place-items:center;font-weight:900}.error{color:#b91c1c;font-size:13px}.okmsg{color:#166534;font-size:13px}.debug{margin-top:8px;font-size:11px;color:#64748b;word-break:break-word}@media(max-width:640px){.wrap{padding:8px}.kpi{font-size:24px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">C</div><div><b>Controla</b><div><small id="companyName">Beta</small></div></div></div><button id="logout" class="btn soft hidden">Sair</button></header>
<main class="wrap">
<section id="login" class="login"><div class="card"><h2>Entrar na Beta</h2><div class="muted">Use o mesmo acesso do app atual.</div><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary">Entrar</button><div id="loginMsg" class="muted" style="margin-top:10px">Beta corrigida • autenticação direta</div><div id="debug" class="debug"></div></div></section>
<section id="app" class="hidden"><div class="nav" id="nav"><button data-tab="inicio" class="active">Início</button><button data-tab="equipes">Equipes</button><button data-tab="funcionarios">Funcionários</button><button data-tab="operacoes">Operações</button><button data-tab="frota">Conduções</button><button data-tab="alertas">Alertas</button><button data-tab="ia">Controla IA</button></div>
<div id="inicio" class="section active"><div class="grid" id="kpis"></div><div class="card"><div class="toolbar"><strong>Operações de hoje</strong><button id="refreshBtn" class="btn soft">Atualizar</button></div><div id="todayList" class="list"></div></div></div>
<div id="equipes" class="section"><div class="card"><h3>Equipes</h3><div id="teamsList" class="list"></div></div></div>
<div id="funcionarios" class="section"><div class="card"><h3>Funcionários Beta</h3><div id="employeesList" class="list"></div></div></div>
<div id="operacoes" class="section"><div class="card"><h3>Operações / Apanha</h3><div id="operationsList" class="list"></div></div></div>
<div id="frota" class="section"><div class="card"><h3>Conduções</h3><div id="vehiclesList" class="list"></div></div></div>
<div id="alertas" class="section"><div class="card"><div class="toolbar"><h3 style="margin:0">Alertas</h3><button id="refreshAlerts" class="btn soft">Gerar/Atualizar</button></div><div id="alertsList" class="list"></div></div></div>
<div id="ia" class="section"><div class="card chat"><h3>Controla IA</h3><div class="muted">A IA avisará se a chave da OpenAI ainda não estiver configurada.</div><div id="chatbox" class="chatbox"></div><div class="toolbar" style="margin-top:10px"><input id="question" placeholder="Ex.: quais equipes estão atrasadas hoje?" style="flex:1;margin:0"><button id="sendAI" class="btn primary">Enviar</button></div></div></div>
</section></main>
<script>
'use strict';
const URL='https://aycbrqziusxtxhsdfqjk.supabase.co';
const KEY='sb_publishable_OGJX3NBA__JxoyjB3IZNvQ_0nNwh_Xc';
let companyId=null, conversationId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const session=()=>{try{return JSON.parse(localStorage.getItem('controla_beta_session')||'null')}catch{return null}};
const saveSession=s=>localStorage.setItem('controla_beta_session',JSON.stringify(s));
const clearSession=()=>localStorage.removeItem('controla_beta_session');
function setMsg(t,c='muted'){const e=$('#loginMsg');e.className=c;e.textContent=t}
function debug(t){$('#debug').textContent=t||''}
async function parseResponse(r){const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok){const msg=(data&&data.msg)||(data&&data.message)||(data&&data.error_description)||(data&&data.error)||('HTTP '+r.status);throw new Error(msg)}return data}
async function refreshToken(){const s=session();if(!s?.refresh_token)throw new Error('Sessão expirada. Entre novamente.');const r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const data=await parseResponse(r);saveSession(data);return data.access_token}
async function authFetch(path,opts={},retry=true){let s=session();if(!s?.access_token)throw new Error('Você precisa entrar.');const headers={apikey:KEY,Authorization:'Bearer '+s.access_token,...(opts.headers||{})};let r=await fetch(URL+path,{...opts,headers});if(r.status===401&&retry){const token=await refreshToken();headers.Authorization='Bearer '+token;r=await fetch(URL+path,{...opts,headers})}return r}
async function login(email,password){const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await parseResponse(r);saveSession(data);return data}
async function rest(table,query=''){const r=await authFetch('/rest/v1/'+table+(query?'?'+query:''),{headers:{Accept:'application/json'}});return parseResponse(r)}
async function rpc(name,payload){const r=await authFetch('/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return parseResponse(r)}
async function getUser(){const r=await authFetch('/auth/v1/user');return parseResponse(r)}
async function enterApp(){
  const user=await getUser();
  debug('Login confirmado. Carregando empresa Beta...');
  const members=await rest('v2_company_members','select=company_id&user_id=eq.'+encodeURIComponent(user.id)+'&status=eq.active');
  const ids=(members||[]).map(x=>x.company_id);
  if(!ids.length)throw new Error('Seu usuário ainda não possui empresa V2.');
  const filter=ids.map(id=>'"'+id+'"').join(',');
  const companies=await rest('v2_companies','select=id,trade_name&status=eq.active&id=in.('+encodeURIComponent(filter)+')');
  const beta=(companies||[]).find(x=>(x.trade_name||'').includes('BETA'))||(companies||[])[0];
  if(!beta)throw new Error('Empresa Beta não encontrada.');
  companyId=beta.id; $('#companyName').textContent=beta.trade_name||'Beta';
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#logout').classList.remove('hidden'); debug('');
  await refreshAll();
}
$('#loginBtn').addEventListener('click',async()=>{
  const btn=$('#loginBtn'); btn.disabled=true; setMsg('Entrando...'); debug('Enviando autenticação ao Supabase...');
  try{await login($('#email').value.trim(),$('#password').value);setMsg('Login confirmado.','okmsg');await enterApp()}catch(e){setMsg(e.message||String(e),'error');debug('Se esta mensagem aparecer, me mande um print dela.')}finally{btn.disabled=false}
});
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logout').addEventListener('click',()=>{clearSession();location.reload()});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
async function refreshAll(){if(!companyId)return;await Promise.all([loadDashboard(),loadTeams(),loadEmployees(),loadOperations(),loadVehicles(),loadAlerts()])}
async function loadDashboard(){try{const rows=await rest('v2_dashboard_company_summary','select=*&company_id=eq.'+companyId);const d=rows?.[0]||{};const cards=[['Funcionários',d.active_employees||0],['Conduções',d.active_vehicles||0],['Operações hoje',d.operations_today||0],['Em aberto',d.open_operations||0],['Alertas',d.open_alerts||0],['Críticos',d.critical_alerts||0],['Receitas mês',money(d.month_income)],['Despesas mês',money(d.month_expense)]];$('#kpis').innerHTML=cards.map(x=>`<div class="card"><div class="kpi">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');const t=await rest('v2_dashboard_team_today','select=*&company_id=eq.'+companyId+'&order=scheduled_start.asc');$('#todayList').innerHTML=t.length?t.map(o=>`<div class="item"><strong>${esc(o.title)}</strong><span class="pill ${o.delayed?'danger':'ok'}">${o.delayed?'Atrasada '+o.delay_minutes+' min':'No horário'}</span><div class="muted">${esc(o.customer_name||'')} • ${esc(o.location_name||'')}</div></div>`).join(''):'<div class="muted">Nenhuma operação programada para hoje.</div>'}catch(e){$('#todayList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadTeams(){try{const r=await rest('v2_teams','select=name,code,status&company_id=eq.'+companyId+'&order=name.asc');$('#teamsList').innerHTML=r.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.code||'')} • ${esc(x.status)}</div></div>`).join('')||'<div class="muted">Sem equipes.</div>'}catch(e){$('#teamsList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadEmployees(){try{const r=await rest('v2_employees','select=employee_number,full_name,primary_team,status&company_id=eq.'+companyId+'&order=full_name.asc');$('#employeesList').innerHTML=r.map(x=>`<div class="item"><strong>${esc(x.full_name)}</strong><div class="muted">Matrícula ${esc(x.employee_number)} • ${esc(x.primary_team||'Sem equipe')}</div></div>`).join('')||'<div class="muted">Sem funcionários.</div>'}catch(e){$('#employeesList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadOperations(){try{const r=await rest('v2_operations','select=operation_number,title,status,customer_name,location_name,scheduled_start,planned_revenue,actual_revenue&company_id=eq.'+companyId+'&order=scheduled_start.desc&limit=50');$('#operationsList').innerHTML=r.map(x=>`<div class="item"><strong>#${esc(x.operation_number)} • ${esc(x.title)}</strong><span class="pill">${esc(x.status)}</span><div class="muted">${esc(x.customer_name||'')} • ${esc(x.location_name||'')}</div><div class="muted">Previsto: ${money(x.planned_revenue)} • Real: ${money(x.actual_revenue)}</div></div>`).join('')||'<div class="muted">Ainda não há operações na Beta.</div>'}catch(e){$('#operationsList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadVehicles(){try{const r=await rest('v2_vehicles','select=description,plate,current_odometer_km,status&company_id=eq.'+companyId+'&order=description.asc');$('#vehiclesList').innerHTML=r.map(x=>`<div class="item"><strong>${esc(x.description)}</strong><span class="pill ${x.status==='active'?'ok':'warn'}">${esc(x.status)}</span><div class="muted">${esc(x.plate||'Sem placa')} • ${Number(x.current_odometer_km||0).toLocaleString('pt-BR')} km</div></div>`).join('')||'<div class="muted">Sem conduções.</div>'}catch(e){$('#vehiclesList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadAlerts(){try{const r=await rest('v2_alerts','select=title,message,severity,status,created_at&company_id=eq.'+companyId+'&status=in.(open,seen)&order=created_at.desc&limit=50');$('#alertsList').innerHTML=r.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><span class="pill ${x.severity==='critical'?'danger':x.severity==='warning'?'warn':'ok'}">${esc(x.severity)}</span><div class="muted">${esc(x.message||'')}</div></div>`).join('')||'<div class="muted">Nenhum alerta aberto.</div>'}catch(e){$('#alertsList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
$('#refreshBtn').addEventListener('click',refreshAll);
$('#refreshAlerts').addEventListener('click',async()=>{try{await rpc('v2_refresh_company_alerts',{p_company_id:companyId});await loadAlerts();await loadDashboard()}catch(e){alert(e.message)}});
function addChat(t,r){const d=document.createElement('div');d.className='msg '+r;d.textContent=t;$('#chatbox').appendChild(d);$('#chatbox').scrollTop=$('#chatbox').scrollHeight}
$('#sendAI').addEventListener('click',async()=>{const q=$('#question').value.trim();if(!q)return;addChat(q,'user');$('#question').value='';try{const s=session();const body={company_id:companyId,question:q};if(conversationId)body.conversation_id=conversationId;const r=await fetch(URL+'/functions/v1/controla-ai',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await parseResponse(r);if(data?.conversation_id)conversationId=data.conversation_id;addChat(data?.answer||data?.message||'Sem resposta.','ai')}catch(e){addChat(e.message||'Falha ao consultar a IA.','ai')}});
$('#question').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sendAI').click()});
window.addEventListener('error',e=>{if(!$('#app').classList.contains('hidden'))return;setMsg('Erro no navegador: '+e.message,'error');debug('Envie um print desta mensagem.')});
(async()=>{try{if(session()?.access_token){setMsg('Sessão encontrada. Entrando...');await enterApp()}}catch(e){clearSession();setMsg('Sessão anterior expirada. Entre novamente.','muted')}})();
</script>
</body></html>
