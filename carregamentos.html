<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Agro Souza's Controle • Carregamentos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}header{background:#0f172a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}header h1{font-size:20px;margin:0}main{max-width:1280px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{display:block;font-size:12px;font-weight:800;color:#475569;margin:0 0 5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:inherit;background:#fff}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800}.primary{background:#0f172a;color:#fff}.soft{background:#e2e8f0;color:#334155}.bad{background:#fee2e2;color:#7f1d1d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.note{font-size:12px;color:var(--muted)}.truck-card,.surcharge-card{border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin:8px 0;background:#f8fafc}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{background:#f8fafc}.kpi{font-size:27px;font-weight:900}.kpi-label{font-size:12px;color:var(--muted)}.status-ok{color:#166534;font-weight:800}@media(max-width:650px){main{padding:7px}.card{padding:11px}}
</style></head><body><header><h1>Carregamentos • Agro Souza's Controle</h1><small id="userInfo">Carregando...</small></header><main>
<div class="actions" style="margin-bottom:10px"><button class="btn soft" onclick="location.href='/'">← Voltar ao painel</button></div>
<div class="card"><h2>Carregamento do dia <span style="font-size:12px;color:#64748b">V8.7</span></h2><div class="grid">
<div><label>Data</label><input id="loadDate" type="date"></div><div><label>Nome do integrado</label><input id="loadIntegrated"></div><div><label>Cidade</label><input id="loadCity"></div><div><label>Energia</label><select id="loadVoltage"><option>220V</option><option>380V</option></select></div><div><label>Tipo da tomada</label><select id="loadOutlet"><option>Industrial 2P+T (3 pinos)</option><option>Industrial 3P+T (4 pinos)</option><option>Industrial 3P+N+T (5 pinos)</option><option>Outro</option></select></div><div><label>Quantidade de caminhões</label><input id="loadTruckCount" type="number" min="1" max="50" value="1"></div></div></div>
<div class="card"><h2>Caminhões</h2><div id="loadTrucks"></div></div>
<div class="card"><h2>Acréscimos</h2><p class="note">Tempo parado, barro, cata ou outro motivo.</p><div id="loadSurcharges"></div><div class="actions"><button id="addSurcharge" class="btn soft">+ Adicionar acréscimo</button></div></div>
<div class="card"><label>Observações do dia</label><textarea id="loadNotes"></textarea><div class="actions"><button id="saveLoading" class="btn primary">Salvar carregamento</button></div><div id="loadingMsg" class="note"></div></div>
<div class="card"><h2>Histórico</h2><div id="loadingHistory"></div></div>
<div class="card"><h2>Relatórios</h2><div class="grid"><div><label>Tipo</label><select id="loadingReportType"><option value="daily">Diário</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option></select></div><div><label>Data de referência</label><input id="loadingReportDate" type="date"></div><div><label>Integrado</label><input id="loadingReportIntegrated" placeholder="Todos"></div><div><label>Cidade</label><input id="loadingReportCity" placeholder="Todas"></div></div><div class="actions"><button id="refreshLoadingReport" class="btn primary">Atualizar relatório</button><button id="exportLoadingReport" class="btn soft">Exportar CSV</button></div></div>
<div class="grid"><div class="card"><div class="kpi" id="loadRepLoads">0</div><div class="kpi-label">Carregamentos</div></div><div class="card"><div class="kpi" id="loadRepTrucks">0</div><div class="kpi-label">Caminhões</div></div><div class="card"><div class="kpi" id="loadRepBirds">0</div><div class="kpi-label">Aves</div></div><div class="card"><div class="kpi" id="loadRepSurcharge">R$ 0,00</div><div class="kpi-label">Acréscimos</div></div></div><div class="card"><div id="loadingReportTable"></div></div>
</main><script src="config.js"></script><script src="carregamentos.js"></script></body></html>
