name: Comando 360 Reference Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'qa/reference-cleanup.trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove tenant fallback and obsolete root artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(r"const EMPLOYER_FALLBACK=\{legal_name:'[^']*',tax_id:'[^']*'\};", "const EMPLOYER_FALLBACK={legal_name:'',tax_id:''};", s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one EMPLOYER_FALLBACK, got {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          git rm -f --ignore-unmatch \
            index-6.html \
            index.html.html \
            manifest.webmanifest \
            operza.webmanifest \
            agro-souzas-controle-v7.webmanifest \
            Correcao_V8_6_2_Navegacao_Automatica.zip \
            LEIA-ME.txt
          rm -f .github/workflows/reference-cleanup.yml qa/reference-cleanup.trigger
      - name: Verify reference audit
        run: python3 qa/reference_audit.py
      - name: Commit cleanup
        run: |
          git config user.name "Comando 360 QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove tenant fallback and obsolete artifacts"
          git push origin HEAD:main
