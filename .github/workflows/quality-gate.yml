name: Comando 360 Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check JavaScript syntax
        run: |
          for f in ./*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          let failed=false;
          for(const name of ['index.html','dda.html','reparar.html']){
            const text=fs.readFileSync(name,'utf8');
            const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m,index=0;
            while((m=re.exec(text))){
              const attrs=m[1]||'';
              if(/\bsrc\s*=/.test(attrs))continue;
              const type=(attrs.match(/\btype\s*=\s*["']([^"']+)["']/i)||[])[1]||'';
              if(type&&!/(?:java|ecma)script|module/i.test(type))continue;
              index++;
              const startLine=text.slice(0,m.index).split('\n').length;
              try{new vm.Script(m[2],{filename:`${name}:inline-${index}@${startLine}`})}
              catch(e){failed=true;console.error(`INLINE JS FAIL ${name} bloco ${index} linha ~${startLine}`);console.error(e.stack||e)}
            }
          }
          if(failed)process.exit(1);
          console.log('Inline JavaScript: OK');
          NODE

      - name: Check required production files
        run: |
          test -s index.html
          test -s dda.html
          test -s reparar.html
          test -s comando360.webmanifest
          test -s c360-field-offline-hotfix.js
          test -s c360-quality-hotfix.js
          test -s c360-team-chat.js
          test -s c360-farm-cache-hotfix.js
          test -s c360-consumable-edit.js
          test -s c360-ui-polish.css
          test -s sw-v7-02.js
          test -s qa/reference_audit.py

      - name: Reference structural audit
        run: python qa/reference_audit.py

      - name: Validate PWA quality wiring
        run: |
          grep -q 'c360-ui-polish.css' index.html
          grep -q 'c360-field-offline-hotfix.js' index.html
          grep -q 'c360-quality-hotfix.js' index.html
          ! grep -q 'navigator.onLine' index.html
          ! grep -q '<script>window.onload' index.html
          grep -q "comando360-v7-02-hotfix11" sw-v7-02.js
          grep -q "isAppShellNavigation" sw-v7-02.js
          ! grep -q "patchAppHtml" sw-v7-02.js
          ! grep -q "repairLegacyAppHtml" sw-v7-02.js
          ! grep -q "X-Comando360-Repair" sw-v7-02.js
          grep -q "c360-team-chat.js" sw-v7-02.js
          grep -q "c360-farm-cache-hotfix.js" sw-v7-02.js
          grep -q "c360-consumable-edit.js" sw-v7-02.js
          ! grep -q "replaceAll('navigator.onLine'" sw-v7-02.js
          grep -q "2026.09.12-r3" c360-field-offline-hotfix.js
          grep -q "c360NetOnline" c360-field-offline-hotfix.js
          grep -q "registerServiceWorkerEarly" c360-field-offline-hotfix.js
          grep -q "looksLikeLeakedSource" c360-field-offline-hotfix.js
          grep -q "getRegistrations" reparar.html
          grep -q "caches.delete" reparar.html
          grep -q "status:'pending'" c360-quality-hotfix.js
          grep -q "comando360-dda" c360-quality-hotfix.js
          grep -q "2026.09.12-c1" c360-team-chat.js
          grep -q "c360_team_chat_queue_v1" c360-team-chat.js
          grep -q "2026.09.12-f1" c360-farm-cache-hotfix.js
          grep -q "v2_poultry_farms" c360-farm-cache-hotfix.js
          grep -q "poultry_context" c360-farm-cache-hotfix.js
          grep -q "2026.09.12-e1" c360-consumable-edit.js
          grep -q "SALVAR ALTERAÇÕES" c360-consumable-edit.js
          grep -q "v2_inventory_items" c360-consumable-edit.js
          grep -q "UI POLISH 2026.09.10-u1" c360-ui-polish.css

      - name: Basic HTML parse
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              pass
          for name in ('index.html','dda.html','reparar.html'):
              text=Path(name).read_text(encoding='utf-8')
              P().feed(text)
              assert '<html' in text.lower(), f'{name}: missing html root'
              assert '</html>' in text.lower(), f'{name}: missing closing html'
              print(f'{name}: OK ({len(text):,} bytes)')
          css=Path('c360-ui-polish.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'c360-ui-polish.css: unbalanced braces'
          assert 'body.darkmode' in css, 'c360-ui-polish.css: dark theme rules missing'
          assert '#inicio' in css, 'c360-ui-polish.css: dashboard polish missing'
          print(f'c360-ui-polish.css: OK ({len(css):,} bytes)')
          PY

      - name: Reject obvious secret-key leaks
        run: |
          if grep -R -nE "SUPABASE_SERVICE_ROLE_KEY\s*=|service_role[^[:alnum:]_].*eyJ|client_secret\s*[:=]\s*['\"][^'\"]{12,}" --include='*.js' --include='*.html' --exclude-dir=.git .; then
            echo 'Potential privileged secret found in browser code.'
            exit 1
          fi
