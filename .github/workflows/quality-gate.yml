name: Comando 360 Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] && node --check "$f"
          done
          node --check qa/field_torture.mjs

      - name: Inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          let failed=false;
          for(const name of fs.readdirSync('.').filter(x=>x.endsWith('.html'))){
            const text=fs.readFileSync(name,'utf8');
            const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m,index=0;
            while((m=re.exec(text))){
              const attrs=m[1]||'';
              if(/\bsrc\s*=/.test(attrs))continue;
              const type=(attrs.match(/\btype\s*=\s*["']([^"']+)["']/i)||[])[1]||'';
              if(type&&!/(?:java|ecma)script|module/i.test(type))continue;
              index++;
              const startLine=text.slice(0,m.index).split('\n').length;
              try{new vm.Script(m[2],{filename:`${name}:inline-${index}@${startLine}`})}
              catch(e){failed=true;console.error(`INLINE JS FAIL ${name} bloco ${index} linha ~${startLine}`);console.error(e.stack||e)}
            }
          }
          if(failed)process.exit(1);
          console.log('Inline JavaScript: OK');
          NODE

      - name: Required production files
        run: |
          set -euo pipefail
          files=(
            index.html cadastro.html dda.html reparar.html comando360.webmanifest sw-v7-02.js
            c360-autorecovery.js c360-platform.js c360-product-core.js c360-release-core.js
            c360-quality-hotfix.js c360-quality-core.js c360-field-offline-hotfix.js
            c360-field-location-ui-hotfix.js c360-team-chat.js c360-farm-cache-hotfix.js c360-consumable-edit.js
            c360-system-health.js c360-onboarding-entry.js c360-fiscal.js c360-native-tracker-admin.js
            c360-ui-polish.css c360-premium-ui.css c360-product-ui.css c360-release-core.css
            c360-system-health.css c360-fiscal.css qa/reference_audit.py qa/release_scorecard.py qa/performance_budget.mjs qa/field_torture.mjs
            supabase/migrations/20260913104500_add_device_health_heartbeat.sql
            supabase/migrations/20260913203000_self_service_onboarding_v1.sql
            supabase/migrations/20260920122000_explicit_internal_table_deny_policies.sql
            supabase/migrations/20260920122100_preserve_device_security_metadata.sql
            supabase/migrations/20260920140000_dedupe_legacy_employee_rls.sql
            supabase/migrations/20260920220000_native_tracker_live_status_v104.sql
            supabase/migrations/20260922233000_r100_field_hot_path_indexes.sql
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing: $f"; exit 1; }; done

      - name: Reference structural audit
        run: python qa/reference_audit.py

      - name: Release 9.7 scorecard
        run: python qa/release_scorecard.py

      - name: Product architecture contract
        run: |
          set -euo pipefail
          grep -q 'c360-quality-hotfix.js' index.html
          grep -q 'c360-ui-polish.css' index.html
          ! grep -q '<script>window.onload' index.html

          grep -q "BOOT_VERSION='2026.09.20-r98-live1'" c360-quality-hotfix.js
          grep -q "const VERSION='2026.09.22-r100-1'" c360-release-core.js
          grep -q 'c360-autorecovery.js' c360-quality-hotfix.js
          grep -q 'c360-platform.js' c360-quality-hotfix.js
          grep -q 'c360-product-core.js' c360-quality-hotfix.js
          grep -q 'c360-release-core.js' c360-quality-hotfix.js
          grep -q 'c360-release-core.css' c360-quality-hotfix.js
          grep -q 'Promise.allSettled' c360-quality-hotfix.js
          grep -q 'loadScriptsOrderedParallel' c360-quality-hotfix.js
          grep -q 'c360-quality-core.js' c360-quality-hotfix.js
          grep -q 'c360-field-offline-hotfix.js' c360-quality-hotfix.js
          grep -q 'c360-system-health.js' c360-quality-hotfix.js
          grep -q 'c360-onboarding-entry.js' c360-quality-hotfix.js
          grep -q 'c360-native-tracker-admin.js' c360-quality-hotfix.js

          grep -q 'v2_device_location_current' c360-native-tracker-admin.js
          grep -q 'Rastreadores ao vivo' c360-native-tracker-admin.js
          grep -q 'native_battery_percent' c360-native-tracker-admin.js
          grep -q 'v2_native_tracker_heartbeat_v2' android-tracker/app/src/main/java/br/com/comando360/tracker/TrackerApi.kt
          grep -q 'VERSION = "1.0.4"' android-tracker/app/src/main/java/br/com/comando360/tracker/TrackerApi.kt
          grep -q 'handler.postDelayed(this, 60_000L)' android-tracker/app/src/main/java/br/com/comando360/tracker/LocationService.kt

          grep -q '2026.09.13-platform1' c360-platform.js
          grep -q 'window.C360Platform' c360-platform.js
          grep -q 'withBusy' c360-platform.js
          grep -q '2026.09.13-product1' c360-product-core.js
          grep -q 'window.C360Product' c360-product-core.js
          grep -q 'aria-current' c360-product-core.js
          grep -q 'prefers-reduced-motion' c360-product-ui.css
          grep -q 'c360-live-region' c360-product-ui.css
          grep -q 'body.device-mode' c360-product-ui.css

          SW_CORE="$(grep -oE 'sw-v7-02-core-hotfix[0-9]+\.js' sw-v7-02.js | head -n1)"
          test "$SW_CORE" = 'sw-v7-02-core-hotfix59.js'
          test -s "$SW_CORE"
          SW_CONTRACT="$(cat sw-v7-02.js "$SW_CORE")"
          grep -q "comando360-v7-02-hotfix59" <<<"$SW_CONTRACT"
          grep -q 'comando360-stable-v1' <<<"$SW_CONTRACT"
          grep -q 'c360-platform.js' <<<"$SW_CONTRACT"
          grep -q 'c360-product-core.js' <<<"$SW_CONTRACT"
          grep -q './c360-release-core.js' "$SW_CORE"
          grep -q './c360-release-core.css' "$SW_CORE"
          grep -q './c360-native-tracker-admin.js' "$SW_CORE"
          ! grep -q 'CORE.push' sw-v7-02.js
          ! grep -q '?' sw-v7-02.js
          grep -q 'C360_ROLLBACK_TO_STABLE' <<<"$SW_CONTRACT"
          grep -q 'C360_MARK_HEALTHY' <<<"$SW_CONTRACT"
          ! grep -q 'patchAppHtml' <<<"$SW_CONTRACT"
          ! grep -q 'repairLegacyAppHtml' <<<"$SW_CONTRACT"
          grep -q 'sw-auth-refresh-guard.js' sw-v7-02.js
          grep -q "C360_AUTH_REFRESH_GUARD_VERSION='2026.09.22-r2'" sw-auth-refresh-guard.js

          grep -q 'interactiveWall>1500' qa/performance_budget.mjs
          grep -q 'completeWall>2500' qa/performance_budget.mjs
          grep -q 'metrics.resources>90' qa/performance_budget.mjs
          grep -q 'longTasks' qa/performance_budget.mjs

          grep -q 'v2_device_health_heartbeat' c360-system-health.js
          grep -q 'v2_client_health_events' c360-autorecovery.js
          grep -q 'v2_bootstrap_company' cadastro.html
          grep -q 'v2_my_onboarding_status' cadastro.html
          grep -q 'c360FieldSyncStatus' c360-release-core.js
          grep -q 'anti-duplo-salvamento' qa/field_torture.mjs
          grep -q 'idx_v2_operations_created_by_r100' supabase/migrations/20260922233000_r100_field_hot_path_indexes.sql

      - name: HTML and CSS parse
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              P().feed(text)
              assert '<html' in text.lower() and '</html>' in text.lower(), f'{path}: invalid html root'
          for path in Path('.').glob('c360-*.css'):
              css=path.read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'{path}: unbalanced braces'
          print('HTML/CSS parse: OK')
          PY

      - name: Architecture size guard
        run: |
          python - <<'PY'
          from pathlib import Path
          size=Path('index.html').stat().st_size
          print(f'index.html: {size:,} bytes')
          if size>700_000:
              raise SystemExit('index.html exceeded 700 KB release guard')
          if size>600_000:
              print('::warning::index.html remains monolithic; extraction continues after this release without blocking today.')
          PY

      - name: Reject obvious privileged secret leaks
        run: |
          if grep -R -nE "SUPABASE_SERVICE_ROLE_KEY\s*=|service_role[^[:alnum:]_].*eyJ|client_secret\s*[:=]\s*['\"][^'\"]{12,}" --include='*.js' --include='*.html' --exclude-dir=.git .; then
            echo 'Potential privileged secret found in browser code.'
            exit 1
          fi