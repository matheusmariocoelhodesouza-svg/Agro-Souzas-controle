name: Comando 360 Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check production endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://app.comando360.com.br"
          fetch() {
            local path="$1" out="$2"
            for i in $(seq 1 15); do
              if curl --fail --silent --show-error --location --max-time 15 \
                -H 'Cache-Control: no-cache' "${BASE}${path}?qa_run=${GITHUB_SHA}" -o "$out"; then
                return 0
              fi
              sleep 4
            done
            echo "Failed to fetch ${path} from production"
            return 1
          }

          fetch "/" /tmp/index.html
          fetch "/sw-v7-02.js" /tmp/sw.js
          fetch "/reparar.html" /tmp/repair.html
          fetch "/c360-field-offline-hotfix.js" /tmp/field.js
          fetch "/c360-quality-hotfix.js" /tmp/quality.js
          fetch "/c360-quality-core.js" /tmp/quality-core.js
          fetch "/c360-team-chat.js" /tmp/chat.js
          fetch "/c360-farm-cache-hotfix.js" /tmp/farms.js
          fetch "/c360-consumable-edit.js" /tmp/consumables.js
          fetch "/c360-ui-polish.css" /tmp/ui.css
          fetch "/c360-premium-ui.css" /tmp/premium.css
          fetch "/dda.html" /tmp/dda.html
          fetch "/comando360.webmanifest" /tmp/manifest.json

          test -s /tmp/index.html
          test -s /tmp/dda.html
          test -s /tmp/repair.html
          test -s /tmp/field.js
          test -s /tmp/quality.js
          test -s /tmp/quality-core.js
          test -s /tmp/ui.css
          test -s /tmp/premium.css
          test -s /tmp/chat.js
          test -s /tmp/farms.js
          test -s /tmp/consumables.js
          grep -q 'c360-ui-polish.css' /tmp/index.html
          grep -q 'c360-quality-hotfix.js' /tmp/index.html
          ! grep -q 'navigator.onLine' /tmp/index.html
          ! grep -q '<script>window.onload' /tmp/index.html

          grep -q "2026.09.13-b2" /tmp/quality.js
          grep -q "c360-premium-ui.css" /tmp/quality.js
          grep -q "c360-quality-core.js" /tmp/quality.js
          grep -q "c360-field-offline-hotfix.js" /tmp/quality.js
          grep -q "c360-team-chat.js" /tmp/quality.js
          grep -q "c360-farm-cache-hotfix.js" /tmp/quality.js
          grep -q "c360-consumable-edit.js" /tmp/quality.js
          grep -q "QUALITY_VERSION=" /tmp/quality-core.js
          grep -q "comando360-dda" /tmp/quality-core.js

          grep -q "comando360-v7-02-hotfix13" /tmp/sw.js
          grep -q "isAppShellNavigation" /tmp/sw.js
          ! grep -q "patchAppHtml" /tmp/sw.js
          ! grep -q "repairLegacyAppHtml" /tmp/sw.js
          ! grep -q "X-Comando360-Repair" /tmp/sw.js
          grep -q "c360-quality-core.js" /tmp/sw.js
          grep -q "c360-team-chat.js" /tmp/sw.js
          grep -q "c360-farm-cache-hotfix.js" /tmp/sw.js
          grep -q "c360-consumable-edit.js" /tmp/sw.js
          grep -q "c360-premium-ui.css" /tmp/sw.js
          ! grep -q "replaceAll('navigator.onLine'" /tmp/sw.js
          grep -q "2026.09.12-r3" /tmp/field.js
          grep -q "c360NetOnline" /tmp/field.js
          grep -q "registerServiceWorkerEarly" /tmp/field.js
          grep -q "looksLikeLeakedSource" /tmp/field.js
          grep -q "getRegistrations" /tmp/repair.html
          grep -q "caches.delete" /tmp/repair.html
          grep -q "2026.09.12-c1" /tmp/chat.js
          grep -q "c360_team_chat_queue_v1" /tmp/chat.js
          grep -q "v2_team_messages" /tmp/chat.js
          grep -q "SMS emergência" /tmp/chat.js
          grep -q "2026.09.12-f1" /tmp/farms.js
          grep -q "v2_poultry_farms" /tmp/farms.js
          grep -q "poultry_context" /tmp/farms.js
          grep -q "2026.09.12-e1" /tmp/consumables.js
          grep -q "SALVAR ALTERAÇÕES" /tmp/consumables.js
          grep -q "v2_inventory_items" /tmp/consumables.js
          grep -q "UI POLISH 2026.09.10-u1" /tmp/ui.css
          grep -q "PREMIUM UI 2026.09.13-p1" /tmp/premium.css
          grep -q "body.device-mode" /tmp/premium.css
          grep -q "#financeiro" /tmp/premium.css
          grep -q "#operacoes" /tmp/premium.css
          python - <<'PY'
          import json
          from pathlib import Path
          with open('/tmp/manifest.json', encoding='utf-8') as f:
              m=json.load(f)
          assert m.get('name') or m.get('short_name')
          for name in ('/tmp/ui.css','/tmp/premium.css'):
              css=Path(name).read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'{name}: unbalanced braces'
          print('Production PWA + premium UI + bootstrap + activation + chat + farms + consumable editor smoke: OK')
          PY
