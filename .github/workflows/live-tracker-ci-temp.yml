name: Live Tracker CI Temp

on:
  push:
    branches: [feature/live-tracker-dashboard-v104-20260920]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: JavaScript syntax
        run: |
          node --check c360-native-tracker-admin.js
          node --check c360-quality-hotfix.js
          node --check sw-v7-02.js
          node --check sw-v7-02-core-hotfix59.js
      - name: Release contracts
        run: |
          python qa/reference_audit.py
          python qa/release_scorecard.py
          grep -q "BOOT_VERSION='2026.09.20-r98-live1'" c360-quality-hotfix.js
          grep -q 'c360-native-tracker-admin.js' c360-quality-hotfix.js
          grep -q 'v2_device_location_current' c360-native-tracker-admin.js
          grep -q 'native_battery_percent' c360-native-tracker-admin.js
          grep -q 'v2_native_tracker_heartbeat_v2' android-tracker/app/src/main/java/br/com/comando360/tracker/TrackerApi.kt
          grep -q 'versionName = "1.0.4"' android-tracker/app/build.gradle.kts
          grep -q "const CACHE='comando360-v7-02-hotfix59'" sw-v7-02-core-hotfix59.js

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL -o gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
      - name: Build Android 1.0.4
        run: ./gradle-8.11.1/bin/gradle -p android-tracker :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: comando360-rastreador-24h-v1.0.4
          path: android-tracker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
