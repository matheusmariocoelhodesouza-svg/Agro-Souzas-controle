name: Comando 360 One-Time Index Modularization

on:
  push:
    branches: [refactor/modular-index-hotfix58-20260920]

permissions:
  contents: write

jobs:
  modularize:
    if: ${{ !contains(github.event.head_commit.message, '[modularized-index]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract app shell CSS and create isolated PWA hotfix58
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          before=index.read_text(encoding='utf-8')
          start=before.find('<style>'); end=before.find('</style>',start)
          assert start>=0 and end>start
          css=before[start+len('<style>'):end].strip()+'\n'
          assert len(css.encode())>20_000
          Path('c360-app-shell.css').write_text(css,encoding='utf-8')
          after=before[:start]+'<link rel="stylesheet" href="./c360-app-shell.css"/>\n'+before[end+len('</style>'):]
          index.write_text(after,encoding='utf-8')

          old=Path('sw-v7-02-core-hotfix57.js').read_text(encoding='utf-8')
          new=old.replace('comando360-v7-02-hotfix57','comando360-v7-02-hotfix58',1)
          anchor="'./c360-system-health.css','./c360-ui-polish.css','./c360-premium-ui.css','./c360-product-ui.css','./c360-release-core.css',"
          replacement="'./c360-system-health.css','./c360-ui-polish.css','./c360-premium-ui.css','./c360-product-ui.css','./c360-release-core.css','./c360-app-shell.css',"
          assert anchor in new
          Path('sw-v7-02-core-hotfix58.js').write_text(new.replace(anchor,replacement,1),encoding='utf-8')

          sw=Path('sw-v7-02.js'); text=sw.read_text(encoding='utf-8')
          assert 'sw-v7-02-core-hotfix57.js' in text
          sw.write_text(text.replace('loader 7.10','loader 7.11').replace('sw-v7-02-core-hotfix57.js','sw-v7-02-core-hotfix58.js'),encoding='utf-8')

          score=Path('qa/release_scorecard.py'); st=score.read_text(encoding='utf-8')
          if 'hotfix57' in st: score.write_text(st.replace('hotfix57','hotfix58'),encoding='utf-8')

          old_size=len(before.encode()); new_size=len(after.encode()); css_size=len(css.encode())
          assert new_size<old_size-20_000
          assert css.count('{')==css.count('}')
          print(f'index before: {old_size} bytes')
          print(f'index after : {new_size} bytes')
          print(f'shell css   : {css_size} bytes')
          print(f'reduction   : {old_size-new_size} bytes')
          PY
          node --check sw-v7-02.js
          node --check sw-v7-02-core-hotfix58.js

      - name: Commit generated non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Comando 360 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html c360-app-shell.css sw-v7-02.js sw-v7-02-core-hotfix58.js qa/release_scorecard.py
          git commit -m "refactor: modularize app shell CSS with hotfix58 [modularized-index]"
          git push origin HEAD:refactor/modular-index-hotfix58-20260920
