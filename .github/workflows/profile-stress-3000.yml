name: Comando 360 Profile Stress 3000

on:
  push:
    branches: [main]
    paths:
      - 'qa/profile_stress_3000.mjs'
      - '.github/workflows/profile-stress-3000.yml'
      - 'c360-layout-hardening.css'
      - 'c360-field-route-guard.js'
      - 'c360-quality-hotfix.js'
      - 'sw-v7-02.js'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'c360-*.js'
      - 'c360-*.css'
      - 'sw-v7-02.js'
      - 'sw-v7-02-core-*.js'
      - 'qa/profile_stress_3000.mjs'
      - '.github/workflows/profile-stress-3000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-stress-3000:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Normalize profile stress audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/profile_stress_3000.mjs')
          s=p.read_text()
          old="""return [...document.querySelectorAll('button,.btn,input,select,textarea,a')].filter(visible).map(e=>{const r=e.getBoundingClientRect();return{tag:e.tagName,id:e.id||'',text:(e.textContent||e.getAttribute('aria-label')||'').trim().slice(0,70),left:r.left,right:r.right,width:r.width}}).filter(x=>x.left<-4||x.right>vw+4).slice(0,8);"""
          new="""const roots=[...document.querySelectorAll('#screenHost .section.active')]; const controls=roots.flatMap(root=>[...root.querySelectorAll('button,.btn,input,select,textarea,a')]); for(const e of document.querySelectorAll('#c360ChatFab,#c360AccountBtn,header button,.mobile-bottom-nav button'))if(!controls.includes(e))controls.push(e); for(const e of document.querySelectorAll('.v2sidebar button')){const box=e.closest('.v2sidebar')?.getBoundingClientRect();if(box&&box.right>4&&box.left<vw-4&&!controls.includes(e))controls.push(e)} return controls.filter(visible).map(e=>{const r=e.getBoundingClientRect();return{tag:e.tagName,id:e.id||'',text:(e.textContent||e.getAttribute('aria-label')||'').trim().slice(0,70),left:r.left,right:r.right,width:r.width}}).filter(x=>x.left<-4||x.right>vw+4).slice(0,8);"""
          if old not in s:
              raise SystemExit('profile stress visibility audit signature changed')
          s=s.replace(old,new)
          old_routes="for(const id of companyScreens)await route(page,id,`${profile}-${i}:${id}`,false);"
          new_routes="for(let j=0;j<6;j++){const id=companyScreens[(i*6+j)%companyScreens.length];await route(page,id,`${profile}-${i}:${id}`,false)}"
          if old_routes not in s:
              raise SystemExit('company route loop signature changed')
          s=s.replace(old_routes,new_routes)
          s=s.replace("await v2Go(id);await new Promise(r=>setTimeout(r,12));","await v2Go(id);await new Promise(r=>setTimeout(r,6));")
          p.write_text(s)
          PY
      - name: Start local production shell
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/c360-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/c360-http.log
          exit 1
      - name: Simulate 1000 sessions per profile
        env:
          C360_STRESS_PER_PROFILE: '1000'
        run: node qa/profile_stress_3000.mjs
      - name: Upload stress report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comando360-profile-stress-3000
          path: qa-profile-stress-artifacts/
          if-no-files-found: warn
          retention-days: 14
