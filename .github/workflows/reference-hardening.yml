name: Comando 360 Reference Hardening

on:
  push:
    branches: [main]
    paths:
      - 'qa/reference-hardening.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic hardening
        run: python qa/apply_reference_hardening.py
      - name: Verify structural audit after patch
        run: python qa/reference_audit.py
      - name: Commit hardened production HTML
        run: |
          git config user.name "Comando 360 QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html dda.html
          if git diff --cached --quiet; then
            echo "No hardening changes required."
            exit 0
          fi
          git commit -m "fix: remove tenant hard-coding and normalize buttons"
          git push origin HEAD:main
