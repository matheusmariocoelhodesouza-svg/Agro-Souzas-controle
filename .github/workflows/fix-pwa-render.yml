name: Comando 360 PWA Render Repair

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bake runtime assets into app shell and stop HTML rewriting
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="./c360-ui-polish.css">'
          if css_tag not in html:
              assert '</head>' in html
              html = html.replace('</head>', css_tag + '\n</head>', 1)

          field_tag = '<script src="./c360-field-offline-hotfix.js"></script>'
          if field_tag not in html:
              marker = "</section></main>\n<script>\n'use strict';"
              assert marker in html, 'main app script marker not found'
              html = html.replace(marker, "</section></main>\n" + field_tag + "\n<script>\n'use strict';", 1)

          quality_tag = '<script src="./c360-quality-hotfix.js"></script>'
          if quality_tag not in html:
              pos = html.rfind('</body>')
              assert pos >= 0, 'closing body not found'
              html = html[:pos] + quality_tag + '\n' + html[pos:]

          native_count = html.count('navigator.onLine')
          if native_count:
              html = html.replace('navigator.onLine', 'c360NetOnline()')
          assert 'navigator.onLine' not in html
          assert css_tag in html and field_tag in html and quality_tag in html
          index.write_text(html, encoding='utf-8')
          print('index.html: direct runtime wiring OK; replaced navigator.onLine:', native_count)

          sw_path = Path('sw-v7-02.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace('comando360-v7-02-hotfix4', 'comando360-v7-02-hotfix5')
          start = sw.find('async function patchAppHtml(response){')
          end = sw.find('\nfunction isAppShellNavigation', start)
          assert start >= 0 and end > start, 'patchAppHtml block not found'
          sw = sw[:start] + "async function patchAppHtml(response){\n  return response;\n}\n" + sw[end:]
          assert 'comando360-v7-02-hotfix5' in sw
          assert "replaceAll('navigator.onLine'" not in sw
          sw_path.write_text(sw, encoding='utf-8')
          print('service worker: hotfix5, HTML rewriting disabled')
          PY

      - name: Validate repair
        run: |
          node --check sw-v7-02.js
          python qa/reference_audit.py
          grep -q 'c360-ui-polish.css' index.html
          grep -q 'c360-field-offline-hotfix.js' index.html
          grep -q 'c360-quality-hotfix.js' index.html
          ! grep -q 'navigator.onLine' index.html
          grep -q 'comando360-v7-02-hotfix5' sw-v7-02.js
          ! grep -q "replaceAll('navigator.onLine'" sw-v7-02.js

      - name: Commit repaired app shell
        run: |
          git config user.name 'Comando 360 QA'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw-v7-02.js
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix: make PWA shell deterministic and stop source leakage'
          git push
