name: Comando 360 User Stress 1000

on:
  push:
    branches: [main]
    paths:
      - 'qa/user_stress_1000.mjs'
      - '.github/workflows/user-stress-1000.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'c360-*.js'
      - 'c360-*.css'
      - 'sw-v7-02.js'
      - 'sw-v7-02-core-*.js'
      - 'qa/user_stress_1000.mjs'
      - '.github/workflows/user-stress-1000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-stress-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Normalize user-like stress timing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/user_stress_1000.mjs')
          s=p.read_text()
          s=s.replace("if(i>1&&i%50===0)await reloadMode(page,'admin');", "if(i>1&&i%50===0){await context.close();({context,page}=await openMode(browser,'admin','stress-admin'));results.reloads++;}")
          s=s.replace("if(i>1&&i%50===0)await reloadMode(page,'field');", "if(i>1&&i%50===0){await context.close();({context,page}=await openMode(browser,'field','stress-field'));results.reloads++;}")
          s=s.replace("  const loc=page.locator(selector);if(!await loc.count())return false;\n  await loc.first().click({timeout:1800});results.actions++;", "  const loc=page.locator(selector);if(!await loc.count())return false;\n  if(selector==='#newPoultryOp'||selector==='#newMaintenanceBtn')await page.waitForTimeout(220);\n  await loc.first().click({timeout:2200});results.actions++;")
          s=s.replace("if(i%9===0)await clickIf(page,'#themeToggle',`admin-${i}:tema`);", "if(i%9===0&&await page.locator('#themeToggle').isVisible())await clickIf(page,'#themeToggle',`admin-${i}:tema`);")
          s=s.replace("if(i%11===0&&await page.locator('#c360AccountBtn').count()){await clickIf(page,'#c360AccountBtn',`admin-${i}:conta`);await page.keyboard.press('Escape').catch(()=>{})}", "if(i%11===0&&await page.locator('#c360AccountBtn').count()){await clickIf(page,'#c360AccountBtn',`admin-${i}:conta`);await page.evaluate(()=>document.querySelector('#c360AccountMenu')?.classList.add('hidden'))}")
          p.write_text(s)
          PY
      - name: Start local production shell
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/c360-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/c360-http.log
          exit 1
      - name: Simulate 1000 user sessions
        env:
          C360_STRESS_SESSIONS: '1000'
        run: node qa/user_stress_1000.mjs
      - name: Upload stress report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comando360-user-stress-1000
          path: qa-stress-artifacts/
          if-no-files-found: warn
          retention-days: 14
