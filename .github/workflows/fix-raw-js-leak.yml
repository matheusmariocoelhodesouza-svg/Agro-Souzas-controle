name: Comando 360 - Corrigir JS visível

on:
  push:
    paths:
      - '.github/workflows/fix-raw-js-leak.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir HTML e renovar cache
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          unsafe = [
              r'<script>window.onload=()=>window.print();<\/script>',
              r'<script>window.onload=function(){setTimeout(function(){window.print()},250)}<\/script>',
          ]
          removed = 0
          for needle in unsafe:
              count = text.count(needle)
              removed += count
              text = text.replace(needle, '')

          if removed != 3:
              raise SystemExit(f'Esperava remover 3 scripts internos de impressão; removidos: {removed}')

          close_needle = ' w.document.close();\n}'
          close_count = text.count(close_needle)
          if close_count != 3:
              raise SystemExit(f'Esperava 3 fechamentos de janela de impressão; encontrados: {close_count}')

          text = text.replace(
              close_needle,
              " w.document.close();\n try{setTimeout(()=>{w.focus();w.print()},250)}catch(e){}\n}"
          )

          if '<script>window.onload' in text:
              raise SystemExit('Ainda existe script interno de impressão no index.html')

          index.write_text(text, encoding='utf-8')

          sw = Path('sw-v7-02.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "const CACHE='comando360-v7-02-hotfix6';" not in sw_text:
              raise SystemExit('Versão esperada do cache não encontrada')
          sw_text = sw_text.replace(
              "const CACHE='comando360-v7-02-hotfix6';",
              "const CACHE='comando360-v7-02-hotfix7';",
              1,
          )
          sw.write_text(sw_text, encoding='utf-8')

      - name: Validar que o código não pode virar texto da página
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F '<script>window.onload' index.html
          grep -F "comando360-v7-02-hotfix7" sw-v7-02.js

      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw-v7-02.js
          git commit -m 'fix: impedir JavaScript visível na ativação do celular'
          git push origin HEAD:main
