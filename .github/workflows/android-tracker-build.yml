name: Comando 360 Android Tracker

on:
  push:
    branches: [main]
    paths:
      - 'android-tracker/**'
      - '.github/workflows/android-tracker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-tracker/**'
      - '.github/workflows/android-tracker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

      - name: Build tracker APK
        run: ./gradle-8.11.1/bin/gradle -p android-tracker :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: comando360-rastreador-24h-v1.0.2
          path: android-tracker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
