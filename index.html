<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Controla • Beta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0f172a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.kpi{font-size:28px;font-weight:900}.label,.muted{font-size:12px;color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;white-space:nowrap}.nav button{background:#e2e8f0}.nav button.active,.btn.primary{background:var(--accent);color:#fff}.btn.soft{background:#e2e8f0}.hidden{display:none!important}.login{max-width:430px;margin:55px auto}.login input,.chat input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 10px;font:inherit}.section{display:none}.section.active{display:block}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.item strong{display:block}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#e2e8f0}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.danger{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chatbox{min-height:220px;max-height:52vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:88%;white-space:pre-wrap}.msg.user{margin-left:auto;background:#e2e8f0}.msg.ai{background:#fff7ed;border:1px solid #fed7aa}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;background:white;color:#0f172a;display:grid;place-items:center;font-weight:900}.error{color:#b91c1c;font-size:13px}@media(max-width:640px){.wrap{padding:8px}.kpi{font-size:24px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">C</div><div><b>Controla</b><div><small id="companyName">Beta</small></div></div></div><button id="logout" class="btn soft hidden">Sair</button></header>
<main class="wrap">
<section id="login" class="login"><div class="card"><h2>Entrar na Beta</h2><div class="muted">Use o mesmo acesso do app atual.</div><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary">Entrar</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div></section>
<section id="app" class="hidden"><div class="nav" id="nav"><button data-tab="inicio" class="active">Início</button><button data-tab="equipes">Equipes</button><button data-tab="funcionarios">Funcionários</button><button data-tab="operacoes">Operações</button><button data-tab="frota">Conduções</button><button data-tab="alertas">Alertas</button><button data-tab="ia">Controla IA</button></div>
<div id="inicio" class="section active"><div class="grid" id="kpis"></div><div class="card"><div class="toolbar"><strong>Operações de hoje</strong><button id="refreshBtn" class="btn soft">Atualizar</button></div><div id="todayList" class="list"></div></div></div>
<div id="equipes" class="section"><div class="card"><h3>Equipes</h3><div id="teamsList" class="list"></div></div></div>
<div id="funcionarios" class="section"><div class="card"><h3>Funcionários Beta</h3><div id="employeesList" class="list"></div></div></div>
<div id="operacoes" class="section"><div class="card"><h3>Operações / Apanha</h3><div id="operationsList" class="list"></div></div></div>
<div id="frota" class="section"><div class="card"><h3>Conduções</h3><div id="vehiclesList" class="list"></div></div></div>
<div id="alertas" class="section"><div class="card"><div class="toolbar"><h3 style="margin:0">Alertas</h3><button id="refreshAlerts" class="btn soft">Gerar/Atualizar</button></div><div id="alertsList" class="list"></div></div></div>
<div id="ia" class="section"><div class="card chat"><h3>Controla IA</h3><div class="muted">Integração pronta; enquanto a chave da OpenAI não estiver configurada, o servidor avisará.</div><div id="chatbox" class="chatbox"></div><div class="toolbar" style="margin-top:10px"><input id="question" placeholder="Ex.: quais equipes estão atrasadas hoje?" style="flex:1;margin:0"><button id="sendAI" class="btn primary">Enviar</button></div></div></div>
</section></main>
<script>
const URL='https://aycbrqziusxtxhsdfqjk.supabase.co';
const KEY='sb_publishable_OGJX3NBA__JxoyjB3IZNvQ_0nNwh_Xc';
const sb=supabase.createClient(URL,KEY);let companyId=null,conversationId=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function setMsg(t,c){let e=$('#loginMsg');e.className=c||'muted';e.textContent=t}
async function enterApp(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const m=await sb.from('v2_company_members').select('company_id').eq('user_id',user.id).eq('status','active');if(m.error){setMsg(m.error.message,'error');return}const ids=(m.data||[]).map(x=>x.company_id);if(!ids.length){setMsg('Seu usuário ainda não possui empresa V2.','error');return}const c=await sb.from('v2_companies').select('id,trade_name').in('id',ids).eq('status','active');const beta=(c.data||[]).find(x=>(x.trade_name||'').includes('BETA'))||(c.data||[])[0];if(!beta){setMsg('Empresa Beta não encontrada.','error');return}companyId=beta.id;$('#companyName').textContent=beta.trade_name||'Beta';$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');await refreshAll()}
$('#loginBtn').onclick=async()=>{setMsg('Entrando...');const r=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(r.error){setMsg(r.error.message,'error');return}await enterApp()};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#nav').onclick=e=>{let b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))};
async function refreshAll(){if(!companyId)return;await Promise.all([loadDashboard(),loadTeams(),loadEmployees(),loadOperations(),loadVehicles(),loadAlerts()])}
async function loadDashboard(){let r=await sb.from('v2_dashboard_company_summary').select('*').eq('company_id',companyId).maybeSingle(),d=r.data||{};let cards=[['Funcionários',d.active_employees||0],['Conduções',d.active_vehicles||0],['Operações hoje',d.operations_today||0],['Em aberto',d.open_operations||0],['Alertas',d.open_alerts||0],['Críticos',d.critical_alerts||0],['Receitas mês',money(d.month_income)],['Despesas mês',money(d.month_expense)]];$('#kpis').innerHTML=cards.map(x=>`<div class="card"><div class="kpi">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');let t=await sb.from('v2_dashboard_team_today').select('*').eq('company_id',companyId).order('scheduled_start');$('#todayList').innerHTML=(t.data||[]).length?(t.data||[]).map(o=>`<div class="item"><strong>${esc(o.title)}</strong><span class="pill ${o.delayed?'danger':'ok'}">${o.delayed?'Atrasada '+o.delay_minutes+' min':'No horário'}</span><div class="muted">${esc(o.customer_name||'')} • ${esc(o.location_name||'')}</div></div>`).join(''):'<div class="muted">Nenhuma operação programada para hoje.</div>'}
async function loadTeams(){let r=await sb.from('v2_teams').select('name,code,status').eq('company_id',companyId).order('name');$('#teamsList').innerHTML=(r.data||[]).map(x=>`<div class="item"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.code||'')} • ${esc(x.status)}</div></div>`).join('')||'<div class="muted">Sem equipes.</div>'}
async function loadEmployees(){let r=await sb.from('v2_employees').select('employee_number,full_name,primary_team,status').eq('company_id',companyId).order('full_name');$('#employeesList').innerHTML=(r.data||[]).map(x=>`<div class="item"><strong>${esc(x.full_name)}</strong><div class="muted">Matrícula ${esc(x.employee_number)} • ${esc(x.primary_team||'Sem equipe')}</div></div>`).join('')||'<div class="muted">Sem funcionários.</div>'}
async function loadOperations(){let r=await sb.from('v2_operations').select('operation_number,title,status,customer_name,location_name,scheduled_start,planned_revenue,actual_revenue').eq('company_id',companyId).order('scheduled_start',{ascending:false}).limit(50);$('#operationsList').innerHTML=(r.data||[]).map(x=>`<div class="item"><strong>#${x.operation_number} • ${esc(x.title)}</strong><span class="pill">${esc(x.status)}</span><div class="muted">${esc(x.customer_name||'')} • ${esc(x.location_name||'')}</div><div class="muted">Previsto: ${money(x.planned_revenue)} • Real: ${money(x.actual_revenue)}</div></div>`).join('')||'<div class="muted">Ainda não há operações na Beta.</div>'}
async function loadVehicles(){let r=await sb.from('v2_vehicles').select('description,plate,current_odometer_km,status').eq('company_id',companyId).order('description');$('#vehiclesList').innerHTML=(r.data||[]).map(x=>`<div class="item"><strong>${esc(x.description)}</strong><span class="pill ${x.status==='active'?'ok':'warn'}">${esc(x.status)}</span><div class="muted">${esc(x.plate||'Sem placa')} • ${Number(x.current_odometer_km||0).toLocaleString('pt-BR')} km</div></div>`).join('')||'<div class="muted">Sem conduções.</div>'}
async function loadAlerts(){let r=await sb.from('v2_alerts').select('title,message,severity,status,created_at').eq('company_id',companyId).in('status',['open','seen']).order('created_at',{ascending:false}).limit(50);$('#alertsList').innerHTML=(r.data||[]).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><span class="pill ${x.severity==='critical'?'danger':x.severity==='warning'?'warn':'ok'}">${esc(x.severity)}</span><div class="muted">${esc(x.message||'')}</div></div>`).join('')||'<div class="muted">Nenhum alerta aberto.</div>'}
$('#refreshBtn').onclick=refreshAll;$('#refreshAlerts').onclick=async()=>{let r=await sb.rpc('v2_refresh_company_alerts',{p_company_id:companyId});if(r.error)alert(r.error.message);await loadAlerts();await loadDashboard()};
function addChat(t,r){let d=document.createElement('div');d.className='msg '+r;d.textContent=t;$('#chatbox').appendChild(d);$('#chatbox').scrollTop=$('#chatbox').scrollHeight}
$('#sendAI').onclick=async()=>{let q=$('#question').value.trim();if(!q)return;addChat(q,'user');$('#question').value='';let body={company_id:companyId,question:q};if(conversationId)body.conversation_id=conversationId;let r=await sb.functions.invoke('controla-ai',{body});if(r.error){addChat(r.error.message||'Falha ao consultar a IA.','ai');return}if(r.data?.conversation_id)conversationId=r.data.conversation_id;addChat(r.data?.answer||r.data?.message||'Sem resposta.','ai')};$('#question').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sendAI').click()});
(async()=>{let s=(await sb.auth.getSession()).data.session;if(s)await enterApp()})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
