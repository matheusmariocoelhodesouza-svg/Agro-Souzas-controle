<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Reparar Comando 360</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid #e3eaf3;border-radius:22px;padding:24px;box-shadow:0 16px 48px rgba(15,39,71,.12);text-align:center}.mark{width:68px;height:68px;margin:0 auto 14px;border-radius:19px;background:#0f2747;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:900}h1{font-size:23px;margin:0 0 8px}p{color:#64748b;font-size:14px;line-height:1.5}.status{margin:18px 0;padding:13px;border-radius:13px;background:#eef5ff;color:#184f8d;font-weight:800;font-size:13px}.ok{background:#e9f8ef;color:#187447}.err{background:#fff0f0;color:#a82626}button{width:100%;border:0;border-radius:12px;padding:13px 15px;background:#0f2747;color:#fff;font:inherit;font-weight:850;cursor:pointer;margin-top:8px}</style>
</head>
<body>
<div class="card">
  <div class="mark">C</div>
  <h1>Reparando o Comando 360</h1>
  <p>Esta tela limpa somente os arquivos temporários do aplicativo. O vínculo deste celular com a equipe e os dados salvos no aparelho são preservados.</p>
  <div class="status" id="status">Preparando atualização...</div>
  <button id="retry" type="button" hidden>TENTAR NOVAMENTE</button>
</div>
<script>
(async()=>{
 const status=document.getElementById('status'),retry=document.getElementById('retry');
 async function repair(){
  retry.hidden=true;status.className='status';status.textContent='Removendo a versão antiga...';
  try{
   if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.filter(k=>k.startsWith('comando360-')).map(k=>caches.delete(k)));
   }
   status.textContent='Baixando a versão corrigida...';
   await fetch('./index.html?repair='+Date.now(),{cache:'no-store',credentials:'same-origin'});
   status.className='status ok';status.textContent='Atualização concluída ✓ Abrindo o aplicativo...';
   setTimeout(()=>location.replace('./?repair='+Date.now()),700);
  }catch(e){
   status.className='status err';status.textContent='Não consegui concluir a atualização. Confirme a internet e tente novamente.';retry.hidden=false;
  }
 }
 retry.addEventListener('click',repair);repair();
})();
</script>
</body>
</html>
